const MAX_BOARD = 7;          // règle : plateau à 7

// à partir de la salle bonusFrom, ils gagnent +1/+1 toutes les bonusStep salles.
const ENEMY = { rankStep: 3, bonusFrom: 9, bonusStep: 3 };

const TRIG = {
  startCombat: 'Début de combat', deathrattle: "Râle d'agonie", endCombat: 'Fin de combat',
  battlecry: 'Cri de guerre', startRenfort: 'Début de renfort', endRenfort: 'Fin de renfort'
};
// Règle : une compétence est soit de combat, soit de renfort, jamais les deux.
const TRIG_KIND = { startCombat: 'combat', deathrattle: 'combat', endCombat: 'combat', battlecry: 'renfort', startRenfort: 'renfort', endRenfort: 'renfort' };

let UID = 0;
const uid = () => ++UID;
const rand = n => Math.floor(Math.random() * n);
const pick = a => a[rand(a.length)];

const sk = (t, fx, a = 0, h = 0, n = 0) => ({ t, fx, a, h, n });
function skDesc(k) {
  const bf = `+${k.a}/+${k.h}`;
  const d = {
    buffSelf: `${bf} à lui-même`,
    buffAllies: `${bf} aux autres alliés`,
    buffRandomAlly: `${bf} à un allié aléatoire`,
    buffLeftmost: `${bf} à l'allié le plus à gauche`,
    dmgRandomEnemy: `${k.n} dégâts à un ennemi aléatoire`
  }[k.fx];
  return `${TRIG[k.t]} : ${d}`;
}

// =====================================================================
// MOTEUR DE RÈGLES
// =====================================================================
function mkServant(d) {
  return { uid: uid(), name: d.name, rank: d.rank, atk: d.atk, hp: d.hp, maxhp: d.hp,
           types: [...d.types], kw: [...d.kw], skill: d.skill, equips: [] };
}

// Règle : Bouclier divin annule la première source de dégâts ; Poison détruit
// tout serviteur auquel il inflige réellement des dégâts.
function hit(t, amt, src) {
  if (amt <= 0) return false;
  if (t.shield) { t.shield = false; return false; }
  t.hp -= amt;
  if (src && src.kw.includes('poison')) t.hp = Math.min(t.hp, 0);
  return true;
}

function applyFx(k, src, allies, enemies, say) {
  const alive = l => l.filter(s => s.hp > 0);
  const buff = (s, a, h) => { s.atk += a; s.hp += h; s.maxhp += h; };
  switch (k.fx) {
    case 'buffSelf':
      buff(src, k.a, k.h); say(`${src.name} gagne +${k.a}/+${k.h}.`); break;
    case 'buffAllies': {
      const c = alive(allies).filter(s => s !== src);
      c.forEach(s => buff(s, k.a, k.h));
      if (c.length) say(`${src.name} donne +${k.a}/+${k.h} aux autres alliés.`); break;
    }
    case 'buffRandomAlly': {
      let c = alive(allies).filter(s => s !== src);
      if (!c.length) c = alive(allies);
      if (c.length) { const t = pick(c); buff(t, k.a, k.h); say(`${src.name} donne +${k.a}/+${k.h} à ${t.name}.`); }
      break;
    }
    case 'buffLeftmost': {
      const t = alive(allies)[0];
      if (t) { buff(t, k.a, k.h); say(`${src.name} donne +${k.a}/+${k.h} à ${t.name}.`); }
      break;
    }
    case 'dmgRandomEnemy': {
      const c = alive(enemies);
      if (c.length) { const t = pick(c); hit(t, k.n, null); say(`${src.name} inflige ${k.n} dégâts à ${t.name}.`); }
      break;
    }
  }
}

function applyEquip(s, eq) {
  s.atk += eq.atk; s.hp += eq.hp; s.maxhp += eq.hp;
  if (eq.kw && !s.kw.includes(eq.kw)) s.kw.push(eq.kw);
  s.equips.push(eq.name);
}

// Combat automatique. Travaille sur des copies : les serviteurs du joueur
// « reviennent » donc intacts pour le combat suivant.
function runCombat(playerBoard, enemyBoard, ctx) {
  const frames = [];
  const cl = s => ({ ...s, equips: [...s.equips], kw: [...s.kw], shield: s.kw.includes('shield'), reb: s.kw.includes('rebirth') });
  const B = { p: playerBoard.map(cl), e: enemyBoard.map(cl) };
  const other = side => (side === 'p' ? 'e' : 'p');
  const say = (msg, hl) => frames.push({ p: B.p.map(s => ({ ...s })), e: B.e.map(s => ({ ...s })), msg, hl: hl || {} });

  function deaths(prio = []) {
    for (let guard = 0; guard < 500; guard++) {
      const all = [...B.p.map(s => ['p', s]), ...B.e.map(s => ['e', s])].filter(([, s]) => s.hp <= 0);
      if (!all.length) return;
      all.sort((a, b) => {
        const ia = prio.indexOf(a[1].uid), ib = prio.indexOf(b[1].uid);
        return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib);
      });
      const [side, s] = all[0];
      say(`${s.name} (${side === 'p' ? 'allié' : 'ennemi'}) meurt.`, { dead: [s.uid] });
      B[side].splice(B[side].indexOf(s), 1);
      if (s.skill && s.skill.t === 'deathrattle') applyFx(s.skill, s, B[side], B[other(side)], m => say(m));
      if (s.reb) {
        if (B[side].length < MAX_BOARD) {
          B[side].push({ ...s, uid: uid(), hp: 1, reb: false, shield: false });
          say(`${s.name} renaît avec 1 PV, à l'extrême droite.`);
        } else say(`${s.name} ne peut pas renaître : plateau plein.`);
      }
    }
  }

  say('Début du combat.');
  const startFx = (list, allies, enemies) => list.forEach(s => {
    if (s.skill && s.skill.t === 'startCombat') applyFx(s.skill, s, allies, enemies, m => say(m));
  });
  startFx([...B.p], B.p, B.e);
  ctx.heroes.forEach(h => {
    if (h.hp > 0 && h.def.power && h.def.power.t === 'startCombat')
      applyFx(h.def.power, { name: h.def.name, kw: [] }, B.p, B.e, m => say(m));
  });
  startFx([...B.e], B.e, B.p);
  if (ctx.dungeon.boss.power === 'surge') {
    const v = Math.floor((ctx.room - 1) / 3);
    if (v > 0) { B.e.forEach(s => { s.atk += v; s.hp += v; s.maxhp += v; }); say(`${ctx.dungeon.boss.name} : Surcharge, ses serviteurs gagnent +${v}/+${v}.`); }
  }
  deaths();

  const Q = { p: [], e: [] };
  const nextAtk = side => {
    for (;;) {
      if (!Q[side].length) Q[side] = B[side].map(s => s.uid);
      const id = Q[side].shift();
      const s = B[side].find(x => x.uid === id);
      if (s) return s;
    }
  };
  const target = side => {
    const foes = B[other(side)];
    const pv = foes.filter(s => s.kw.includes('prov'));
    return pick(pv.length ? pv : foes);
  };

  let cur = B.e.length > B.p.length ? 'e' : 'p';   // égalité : le joueur commence
  let attacks = 0, fatigue = 0;
  if (B.p.length && B.e.length) say(cur === 'p' ? 'Le joueur attaque en premier.' : 'Le Boss attaque en premier.');
  while (B.p.length && B.e.length && attacks < 3000) {
    if (attacks >= FATIGUE_START) {
      fatigue++;
      [...B.p, ...B.e].forEach(s => { s.hp -= fatigue; });
      say(`Usure : ${fatigue} dégâts à tous les serviteurs.`);
      deaths();
      if (!B.p.length || !B.e.length) break;
    }
    const A = nextAtk(cur), T = target(cur);
    const dA = A.atk, dT = A.kw.includes('ranged') ? 0 : T.atk;
    hit(T, dA, A); hit(A, dT, T);          // dégâts et riposte simultanés
    say(`${A.name} attaque ${T.name} (${dA} dégâts${dT ? `, riposte ${dT}` : ', sans riposte'}).`, { att: A.uid, tgt: T.uid });
    if (ctx.dungeon.boss.power === 'regen') {
      B.e.forEach(s => { if (s.hp > 0) s.hp = Math.min(s.maxhp, s.hp + 2); });
      say('Régénération : les serviteurs du Boss récupèrent 2 PV.');
    }
    deaths([A.uid, T.uid]);
    attacks++; cur = other(cur);
  }
  const winner = B.p.length && !B.e.length ? 'p' : B.e.length && !B.p.length ? 'e' : 'draw';
  say(winner === 'p' ? 'Combat remporté.' : winner === 'e' ? 'Combat perdu.' : 'Égalité : les deux camps sont vides.');
  return { frames, winner, survivors: { p: B.p, e: B.e }, attacks };
}

// ---------- Partie ----------
function newGame(heroIds, dungeonId) {
  const dungeon = DUNGEONS[dungeonId];
  const heroes = heroIds.map(id => ({ def: HEROES[id], hp: HEROES[id].hp, maxhp: HEROES[id].hp }));
  const types = [...new Set([...heroes.flatMap(h => h.def.types), dungeon.type])];
  return {
    heroes, dungeon, types,
    boss: { name: dungeon.boss.name, hp: dungeon.boss.hp, maxhp: dungeon.boss.hp },
    board: heroes.map(h => mkServant(h.def.start)),
    room: 1, level: 1, counter: 0, over: null
  };
}
const levelCost = lvl => lvl + 1;    // niveau N -> N+1 : N+1 renoncements

function genEnemies(g) {
  const k = g.room;
  const n = Math.min(MAX_BOARD, 2 + Math.floor((k - 1) / 2));
  const maxR = Math.min(5, 1 + Math.floor((k - 1) / ENEMY.rankStep));
  const bonus = k >= ENEMY.bonusFrom ? 1 + Math.floor((k - ENEMY.bonusFrom) / ENEMY.bonusStep) : 0;
  const others = ['Mécha', 'Xéno', 'Psi', 'Pirate', 'Drone', 'Nano'].filter(t => t !== g.dungeon.type);
  const types = [g.dungeon.type, ...others.sort(() => Math.random() - 0.5).slice(0, 2)];
  const pool = SERVANTS.filter(s => s.types.some(t => types.includes(t)));
  const out = [];
  for (let i = 0; i < n; i++) {
    const r = Math.random() < 0.6 ? maxR : 1 + rand(maxR);
    let c = pool.filter(s => s.rank === r);
    if (!c.length) c = pool.filter(s => s.rank <= r);
    const e = mkServant(pick(c)); e.atk += bonus; e.hp += bonus; e.maxhp += bonus; out.push(e);
  }
  return out;
}

// Propositions du renfort : rang maximum = niveau de renfort, rangs inférieurs possibles.
function genProposals(g) {
  const pickCards = (pool, rankOf, weightOf) => {
    const res = [];
    for (let guard = 0; res.length < PROPOSALS && guard < 100; guard++) {
      const r = Math.random() < 0.6 ? g.level : 1 + rand(g.level);
      let c = pool.filter(x => rankOf(x) === r && !res.includes(x));
      if (!c.length) c = pool.filter(x => rankOf(x) <= r && !res.includes(x));
      if (!c.length) break;
      const w = c.map(weightOf); let t = Math.random() * w.reduce((a, b) => a + b, 0), i = 0;
      while (t > w[i] && i < c.length - 1) { t -= w[i]; i++; }
      res.push(c[i]);
    }
    return res;
  };
  // Pool de serviteurs : au moins un type commun avec les 5 types de la partie.
  const sPool = SERVANTS.filter(s => s.types.some(t => g.types.includes(t)));
  // Équipements : liés aux types par le pool, mais presque jamais limités à un type à l'usage.
  const ePool = EQUIPS.filter(e => !e.type || g.types.includes(e.type));
  return {
    servants: pickCards(sPool, s => s.rank, s => 1 + s.types.filter(t => g.types.includes(t)).length),
    equips: pickCards(ePool, e => e.rank, e => 1)
  };
}

function renfortFx(g, trig, say) {
  g.board.slice().forEach(s => {
    if (s.skill && s.skill.t === trig) applyFx(s.skill, s, g.board, [], say);
  });
  g.heroes.forEach(h => {
    if (h.hp > 0 && h.def.power && h.def.power.t === trig)
      applyFx(h.def.power, { name: h.def.name, kw: [] }, g.board, [], say);
  });
}
function addServant(g, def, replaceIdx, say) {
  const s = mkServant(def);
  if (replaceIdx != null) { say(`${g.board[replaceIdx].name} est remplacé (ses équipements sont perdus).`); g.board.splice(replaceIdx, 1, s); }
  else g.board.push(s);
  say(`${s.name} rejoint le plateau.`);
  if (s.skill && s.skill.t === 'battlecry') applyFx(s.skill, s, g.board, [], say);
  return s;
}
function closeRenfort(g, skips, say) {
  renfortFx(g, 'endRenfort', say);
  g.counter += skips;
  while (g.level < MAX_LEVEL && g.counter >= levelCost(g.level)) {
    g.counter -= levelCost(g.level); g.level++;
    say(`Niveau de renfort ${g.level} atteint.`);
  }
  if (g.level >= MAX_LEVEL) g.counter = 0;
}

// Règle : fin de combat, les survivants du camp gagnant infligent leur rang.
function settleCombat(g, res) {
  const lines = [];
  if (res.winner === 'p') {
    const dmg = res.survivors.p.reduce((a, s) => a + s.rank, 0);
    g.boss.hp = Math.max(0, g.boss.hp - dmg);
    lines.push(`Vos survivants (${res.survivors.p.map(s => `${s.name} R${s.rank}`).join(', ')}) infligent ${dmg} dégâts au Boss.`);
    if (g.boss.hp <= 0) { g.over = 'win'; lines.push('Le Boss est vaincu !'); }
  } else if (res.winner === 'e') {
    let shield = g.heroes.map(h => h.hp > 0 && h.def.kw === 'shield');
    for (const s of res.survivors.e) {
      const live = g.heroes.map((h, i) => i).filter(i => g.heroes[i].hp > 0);
      if (!live.length) break;
      const prov = live.filter(i => g.heroes[i].def.kw === 'prov');
      const i = prov.length === 1 ? prov[0] : pick(live);
      const h = g.heroes[i];
      if (shield[i]) { shield[i] = false; lines.push(`${s.name} frappe ${h.def.name} (${s.rank}) : annulé par le Bouclier divin.`); continue; }
      h.hp = Math.max(0, h.hp - s.rank);
      lines.push(`${s.name} frappe ${h.def.name} : ${s.rank} dégâts${h.hp <= 0 ? ' — il tombe !' : ''}.`);
    }
    if (g.heroes.every(h => h.hp <= 0)) { g.over = 'lose'; lines.push('Les deux héros sont à terre.'); }
  } else lines.push('Égalité : aucun dégât.');
  g.room++;
  return lines;
}

// ==== UI ====
const app = document.getElementById('app');
const UI = { screen: 'menu', sel: { heroes: [], dungeon: 'nid' }, g: null, rf: null, pb: null, timer: null, replace: null, notice: '' };

const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const TYPE_CLS = { 'Mécha': 'badge-info', 'Xéno': 'badge-success', 'Psi': 'badge-secondary', 'Pirate': 'badge-warning', 'Drone': 'badge-accent', 'Nano': 'badge-primary' };
const typeBadges = ts => ts.map(t => `<span class="badge badge-xs ${TYPE_CLS[t]}">${t}</span>`).join(' ');
const kwBadges = (kw, s) => kw
  .filter(k => !(s && 'shield' in s) || (k === 'shield' ? s.shield : k === 'rebirth' ? s.reb : true))
  .map(k => `<span class="badge badge-xs badge-outline">${KW[k]}</span>`).join(' ');
const skLine = k => `<span class="${TRIG_KIND[k.t] === 'combat' ? 'text-error' : 'text-info'}">${esc(skDesc(k))}</span>`;

function servantCard(s, o = {}) {
  const ring = o.att ? 'ring-2 ring-warning' : o.tgt ? 'ring-2 ring-error' : '';
  const dead = s.hp <= 0 ? 'opacity-40 grayscale' : '';
  return `<div class="card card-compact bg-base-200 border border-base-content/10 shadow w-36 shrink-0 ${ring} ${dead} ${o.cls || ''}" ${o.attrs || ''}>
    <div class="card-body !p-2 gap-1">
      <div class="flex items-start justify-between gap-1"><span class="text-xs font-bold leading-tight">${esc(s.name)}</span><span class="badge badge-neutral badge-xs">R${s.rank}</span></div>
      <div class="flex justify-between text-lg font-extrabold leading-none"><span class="text-warning">⚔ ${s.atk}</span><span class="${s.hp < s.maxhp ? 'text-error' : 'text-success'}">♥ ${s.hp}</span></div>
      <div class="flex flex-wrap gap-0.5">${typeBadges(s.types)}</div>
      <div class="flex flex-wrap gap-0.5">${kwBadges(s.kw, s)}</div>
      ${s.skill ? `<div class="text-[10px] leading-tight">${skLine(s.skill)}</div>` : ''}
      ${s.equips && s.equips.length ? `<div class="text-[10px] opacity-70" title="${esc(s.equips.join(', '))}">🔧 ×${s.equips.length}</div>` : ''}
      ${o.extra || ''}
    </div></div>`;
}
function equipCard(e, o = {}) {
  return `<div class="card card-compact bg-base-200 border border-base-content/10 shadow w-40 shrink-0 ${o.cls || ''}" ${o.attrs || ''}>
    <div class="card-body !p-2 gap-1">
      <div class="flex items-start justify-between gap-1"><span class="text-xs font-bold leading-tight">${esc(e.name)}</span><span class="badge badge-neutral badge-xs">R${e.rank}</span></div>
      <div class="text-base font-extrabold">+${e.atk} / +${e.hp}</div>
      <div class="flex flex-wrap gap-0.5">${e.kw ? `<span class="badge badge-xs badge-outline">${KW[e.kw]}</span>` : ''}
        ${e.type ? `<span class="badge badge-xs ${TYPE_CLS[e.type]}">${e.type}</span>` : '<span class="badge badge-xs badge-ghost">Tous types</span>'}</div>
    </div></div>`;
}
const heroesPanel = g => `<div class="flex flex-wrap gap-2">${g.heroes.map(h => `
  <div class="card card-compact bg-base-200 flex-1 min-w-[13rem] ${h.hp <= 0 ? 'opacity-50' : ''}"><div class="card-body !p-3 gap-1">
    <div class="flex justify-between items-center"><b>${esc(h.def.name)}</b><span>${typeBadges(h.def.types)}</span></div>
    <progress class="progress progress-success" value="${h.hp}" max="${h.maxhp}"></progress>
    <div class="text-xs">♥ ${h.hp}/${h.maxhp} ${h.def.kw ? `<span class="badge badge-xs badge-outline">${KW[h.def.kw]}</span>` : ''}</div>
    <div class="text-[11px]">${skLine(h.def.power)}</div>
    ${h.hp <= 0 ? '<div class="text-error text-xs">À terre : pouvoirs perdus</div>' : ''}
  </div></div>`).join('')}</div>`;
const bossPanel = g => `<div class="card card-compact bg-base-200 border border-error/30"><div class="card-body !p-3 gap-1">
  <div class="flex justify-between"><b class="text-error">${esc(g.boss.name)}</b><span class="text-xs opacity-70">${esc(g.dungeon.name)}</span></div>
  <progress class="progress progress-error" value="${g.boss.hp}" max="${g.boss.maxhp}"></progress>
  <div class="text-xs">♥ ${g.boss.hp}/${g.boss.maxhp}</div>
  <div class="text-[11px] opacity-80">${esc(g.dungeon.boss.desc)}</div></div></div>`;
const header = g => `<div class="flex flex-wrap items-center justify-between gap-2 mb-3">
  <h1 class="text-xl font-bold">Atlas Orbiter <span class="badge badge-ghost">prototype</span></h1>
  <div class="flex gap-2 text-sm"><span class="badge badge-lg">Salle ${g.room}</span><span class="badge badge-lg badge-secondary">Renfort niv. ${g.level}</span>
  <span class="badge badge-lg badge-outline">Types : ${g.types.join(', ')}</span></div></div>`;

// ---------- Écrans ----------
function renderMenu() {
  const sel = UI.sel;
  const heroes = Object.values(HEROES).map(h => `
    <button data-act="selHero" data-id="${h.id}" class="card card-compact bg-base-200 text-left border-2 ${sel.heroes.includes(h.id) ? 'border-primary' : 'border-transparent'} hover:border-primary/50">
      <div class="card-body !p-3 gap-1"><b>${esc(h.name)}</b><div>${typeBadges(h.types)}</div>
      <div class="text-xs">♥ ${h.hp} ${h.kw ? '· ' + KW[h.kw] : ''}</div>
      <div class="text-xs">Serviteur de départ : ${esc(h.start.name)} (${h.start.atk}/${h.start.hp})</div>
      <div class="text-[11px]">${skLine(h.power)}</div></div></button>`).join('');
  const dungeons = Object.values(DUNGEONS).map(d => `
    <button data-act="selDungeon" data-id="${d.id}" class="card card-compact bg-base-200 text-left border-2 ${sel.dungeon === d.id ? 'border-primary' : 'border-transparent'} hover:border-primary/50">
      <div class="card-body !p-3 gap-1"><b>${esc(d.name)}</b><div class="text-xs">Type du donjon : ${typeBadges([d.type])}</div>
      <div class="text-xs">Boss : <b>${esc(d.boss.name)}</b> · ♥ ${d.boss.hp}</div>
      <div class="text-[11px] opacity-80">${esc(d.boss.desc)}</div></div></button>`).join('');
  const types = sel.heroes.length === 2 ? [...new Set([...sel.heroes.flatMap(i => HEROES[i].types), DUNGEONS[sel.dungeon].type])] : [];
  return `<h1 class="text-2xl font-bold mb-1">Atlas Orbiter <span class="badge badge-ghost">prototype</span></h1>
  <p class="opacity-70 mb-4">Premier jet jouable des règles de NEW_IDEAS.md. Contenu et chiffres provisoires.</p>
  <h2 class="font-bold mb-2">1. Choisis deux héros (${sel.heroes.length}/2)</h2><div class="grid gap-2 sm:grid-cols-2 lg:grid-cols-4 mb-4">${heroes}</div>
  <h2 class="font-bold mb-2">2. Choisis un donjon</h2><div class="grid gap-2 sm:grid-cols-2 mb-4">${dungeons}</div>
  <div class="mb-4 text-sm">${types.length ? `Types de la partie (${types.length}) : ${typeBadges(types)}` : 'Sélectionne deux héros.'}</div>
  <button class="btn btn-primary" data-act="start" ${sel.heroes.length === 2 ? '' : 'disabled'}>Partir en exploration</button>
  <div class="collapse collapse-arrow bg-base-200 mt-6"><input type="checkbox"><div class="collapse-title font-bold">Rappel des règles</div>
  <div class="collapse-content text-sm space-y-1">
    <p>• Les héros sont des commandants hors plateau. Leurs serviteurs s'affrontent à leur place. Victoire : PV du Boss à 0. Défaite : PV des deux héros à 0.</p>
    <p>• Combat automatique : le camp le plus nombreux commence (égalité : vous). Attaque de gauche à droite en alternance, cible au hasard (Provocation d'abord), riposte simultanée sauf À distance.</p>
    <p>• Fin de combat : les survivants du camp gagnant infligent leur rang en dégâts (au Boss, ou aux héros un serviteur après l'autre).</p>
    <p>• Renfort (après chaque combat) : deux choix — un serviteur et un équipement. On peut renoncer à un choix : N+1 renoncements font passer le renfort du niveau N au niveau N+1, ce qui relève le rang maximum des propositions.</p>
    <p>• Provisoire : contenu, types, chiffres, nombre de propositions (${PROPOSALS}), niveau max (${MAX_LEVEL}), seuil d'usure (${FATIGUE_START} attaques).</p>
  </div></div>`;
}

function renderRenfort() {
  const g = UI.g, rf = UI.rf, cost = levelCost(g.level), maxed = g.level >= MAX_LEVEL;
  const equipMode = rf.equipIdx != null;
  const board = g.board.map((s, i) => servantCard(s, {
    cls: equipMode ? 'cursor-pointer ring-2 ring-primary/60 hover:ring-primary' : '',
    attrs: equipMode ? `data-act="equipTarget" data-uid="${s.uid}"` : '',
    extra: `<div class="join justify-center mt-1">
      <button class="btn btn-xs join-item" data-act="mv" data-uid="${s.uid}" data-dir="-1" ${i === 0 ? 'disabled' : ''}>◀</button>
      <button class="btn btn-xs join-item" data-act="mv" data-uid="${s.uid}" data-dir="1" ${i === g.board.length - 1 ? 'disabled' : ''}>▶</button></div>`
  })).join('');
  const servants = rf.servants.map((d, i) => servantCard({ ...d, maxhp: d.hp, equips: [] }, {
    cls: rf.sDone ? 'opacity-40 pointer-events-none' : 'cursor-pointer hover:ring-2 hover:ring-primary', attrs: `data-act="takeServant" data-i="${i}"`
  })).join('');
  const equips = rf.equips.map((e, i) => equipCard(e, {
    cls: (rf.eDone ? 'opacity-40 pointer-events-none ' : 'cursor-pointer hover:ring-2 hover:ring-primary ') + (rf.equipIdx === i ? 'ring-2 ring-primary' : ''),
    attrs: `data-act="takeEquip" data-i="${i}"`
  })).join('');
  const modal = UI.replace != null ? `<dialog class="modal modal-open"><div class="modal-box max-w-5xl">
    <h3 class="font-bold text-lg mb-1">Plateau plein : quel serviteur remplacer ?</h3>
    <p class="text-sm opacity-70 mb-3">Les équipements du serviteur remplacé sont perdus.</p>
    <div class="flex flex-wrap gap-2 justify-center">${g.board.map((s, i) => servantCard(s, { cls: 'cursor-pointer hover:ring-2 hover:ring-error', attrs: `data-act="doReplace" data-ri="${i}"` })).join('')}</div>
    <div class="modal-action"><button class="btn" data-act="cancelReplace">Annuler</button></div></div></dialog>` : '';
  return `${header(g)}
  <div class="grid gap-3 lg:grid-cols-3 mb-3"><div class="lg:col-span-2">${heroesPanel(g)}</div>${bossPanel(g)}</div>
  <div class="alert mb-3 ${maxed ? 'alert-success' : 'alert-info'}"><div class="w-full">
    <div class="font-bold">Niveau de renfort ${g.level}${maxed ? ' (maximum)' : ''}</div>
    ${maxed ? '' : `<div class="text-sm">Prochain niveau : ${cost} renoncements (acquis : ${g.counter}${rf.skips ? `, +${rf.skips} ce renfort` : ''}).</div>
    <progress class="progress progress-secondary w-full" value="${Math.min(cost, g.counter + rf.skips)}" max="${cost}"></progress>`}
    <div class="text-xs opacity-80">Les propositions ont un rang maximum de ${g.level}. Renoncer à un serviteur ou à un équipement compte pour 1 renoncement.</div></div></div>
  ${rf.log.length ? `<div class="alert alert-warning mb-3 text-sm"><div>${rf.log.map(esc).join('<br>')}</div></div>` : ''}
  <h2 class="font-bold mb-1">Ton plateau (${g.board.length}/${MAX_BOARD}) ${equipMode ? '<span class="badge badge-primary">Choisis le serviteur à équiper</span> <button class="btn btn-xs" data-act="cancelEquip">Annuler</button>' : ''}</h2>
  <div class="flex flex-wrap gap-2 mb-4">${board}</div>
  <h2 class="font-bold mb-1">Choix 1 — un serviteur ${rf.sDone ? '✔' : ''}</h2>
  <div class="flex flex-wrap gap-2 mb-2">${servants}</div>
  <button class="btn btn-sm btn-outline mb-4" data-act="skipServant" ${rf.sDone ? 'disabled' : ''}>Renoncer au serviteur (+1 renoncement)</button>
  <h2 class="font-bold mb-1">Choix 2 — un équipement ${rf.eDone ? '✔' : ''}</h2>
  <div class="flex flex-wrap gap-2 mb-2">${equips}</div>
  <button class="btn btn-sm btn-outline mb-4" data-act="skipEquip" ${rf.eDone ? 'disabled' : ''}>Renoncer à l'équipement (+1 renoncement)</button>
  <div><button class="btn btn-primary" data-act="finishRenfort" ${rf.sDone && rf.eDone ? '' : 'disabled'}>Terminer le renfort et combattre</button></div>${modal}`;
}

function renderCombat() {
  const g = UI.g, pb = UI.pb, f = pb.res.frames[pb.i];
  const row = list => list.length ? list.map(s => servantCard(s, { att: f.hl.att === s.uid, tgt: f.hl.tgt === s.uid })).join('') : '<div class="opacity-50 text-sm p-6">— vide —</div>';
  const log = pb.res.frames.slice(0, pb.i + 1).map(x => x.msg).slice(-60);
  const speeds = [['Lent', 900], ['Normal', 450], ['Rapide', 150]];
  return `${header(g)}
  ${UI.notice ? `<div class="alert alert-success mb-3 text-sm">${esc(UI.notice)}</div>` : ''}
  <div class="mb-3">${bossPanel(g)}</div>
  <div class="text-center text-xs opacity-60 mb-1">Ennemis</div>
  <div class="flex flex-wrap justify-center gap-2 min-h-[8rem] mb-2">${row(f.e)}</div>
  <div class="divider my-1">VS</div>
  <div class="flex flex-wrap justify-center gap-2 min-h-[8rem] mb-1">${row(f.p)}</div>
  <div class="text-center text-xs opacity-60 mb-3">Vos serviteurs</div>
  <div class="mb-3">${heroesPanel(g)}</div>
  <div class="flex flex-wrap items-center gap-2 mb-2">
    ${pb.done ? '' : `<div class="join">${speeds.map(([n, v]) => `<button class="btn btn-sm join-item ${pb.speed === v ? 'btn-active' : ''}" data-act="speed" data-v="${v}">${n}</button>`).join('')}</div>
    <button class="btn btn-sm btn-outline" data-act="skip">Passer l'animation</button>`}
    <span class="text-xs opacity-60">Image ${pb.i + 1}/${pb.res.frames.length}</span></div>
  <div id="log" class="bg-base-200 rounded-box p-3 h-48 overflow-y-auto text-sm font-mono space-y-0.5">${log.map(esc).join('<br>')}</div>
  ${pb.done ? `<div class="alert ${pb.res.winner === 'p' ? 'alert-success' : pb.res.winner === 'e' ? 'alert-error' : 'alert-warning'} mt-3">
    <div><div class="font-bold">${pb.res.winner === 'p' ? 'Combat gagné' : pb.res.winner === 'e' ? 'Combat perdu' : 'Égalité'}</div>
    ${pb.lines.map(l => `<div class="text-sm">${esc(l)}</div>`).join('')}</div></div>
    <button class="btn btn-primary mt-3" data-act="next">${g.over ? 'Voir le résultat' : 'Continuer vers le renfort'}</button>` : ''}`;
}

function renderEnd() {
  const g = UI.g, win = g.over === 'win';
  return `<div class="hero py-10"><div class="hero-content text-center"><div class="max-w-md">
    <h1 class="text-4xl font-bold ${win ? 'text-success' : 'text-error'}">${win ? 'Victoire !' : 'Défaite'}</h1>
    <p class="py-4">${win ? `${esc(g.boss.name)} est vaincu` : 'Vos deux héros sont à terre'} après ${g.room - 1} salle${g.room - 1 > 1 ? 's' : ''}.</p>
    <div class="stats stats-vertical sm:stats-horizontal shadow mb-4">
      <div class="stat"><div class="stat-title">Salles</div><div class="stat-value">${g.room - 1}</div></div>
      <div class="stat"><div class="stat-title">Niveau de renfort</div><div class="stat-value">${g.level}</div></div>
      <div class="stat"><div class="stat-title">PV du Boss</div><div class="stat-value">${g.boss.hp}</div></div></div>
    <div><button class="btn btn-primary" data-act="restart">Nouvelle partie</button></div></div></div></div>`;
}

function render() {
  const y = window.scrollY;
  app.innerHTML = { menu: renderMenu, renfort: renderRenfort, combat: renderCombat, end: renderEnd }[UI.screen]();
  const l = document.getElementById('log'); if (l) l.scrollTop = l.scrollHeight;
  window.scrollTo(0, y);
}

// ---------- Déroulement ----------
function startCombatUI() {
  const res = runCombat(UI.g.board, genEnemies(UI.g), UI.g);
  UI.pb = { res, i: 0, speed: 450, done: false, lines: null };
  UI.screen = 'combat'; render(); schedule();
}
function schedule() {
  clearTimeout(UI.timer);
  const pb = UI.pb;
  if (!pb || pb.done) return;
  UI.timer = setTimeout(() => {
    if (pb.i < pb.res.frames.length - 1) pb.i++;
    if (pb.i >= pb.res.frames.length - 1) finishPb(); else { render(); schedule(); }
  }, pb.speed);
}
function finishPb() {
  const pb = UI.pb; clearTimeout(UI.timer);
  pb.i = pb.res.frames.length - 1;
  pb.lines = settleCombat(UI.g, pb.res); pb.done = true; render();
}
function openRenfort() {
  const g = UI.g, p = genProposals(g), log = [];
  renfortFx(g, 'startRenfort', m => log.push(m));
  UI.rf = { servants: p.servants, equips: p.equips, sDone: false, eDone: false, skips: 0, equipIdx: null, log };
  UI.screen = 'renfort'; render();
}

const ACT = {
  selHero(d) { const h = UI.sel.heroes, i = h.indexOf(d.id); if (i >= 0) h.splice(i, 1); else if (h.length < 2) h.push(d.id); render(); },
  selDungeon(d) { UI.sel.dungeon = d.id; render(); },
  start() { UI.g = newGame(UI.sel.heroes, UI.sel.dungeon); UI.notice = ''; startCombatUI(); },
  speed(d) { UI.pb.speed = +d.v; render(); schedule(); },
  skip() { finishPb(); },
  next() { UI.notice = ''; if (UI.g.over) { UI.screen = 'end'; render(); } else openRenfort(); },
  takeServant(d) {
    const g = UI.g, rf = UI.rf, def = rf.servants[+d.i];
    if (g.board.length >= MAX_BOARD) { UI.replace = +d.i; render(); return; }
    addServant(g, def, null, m => rf.log.push(m)); rf.sDone = true; render();
  },
  doReplace(d) {
    const g = UI.g, rf = UI.rf;
    addServant(g, rf.servants[UI.replace], +d.ri, m => rf.log.push(m)); UI.replace = null; rf.sDone = true; render();
  },
  cancelReplace() { UI.replace = null; render(); },
  skipServant() { UI.rf.skips++; UI.rf.sDone = true; render(); },
  takeEquip(d) { UI.rf.equipIdx = +d.i; render(); },
  cancelEquip() { UI.rf.equipIdx = null; render(); },
  equipTarget(d) {
    const rf = UI.rf, s = UI.g.board.find(x => x.uid === +d.uid), e = rf.equips[rf.equipIdx];
    applyEquip(s, e); rf.log.push(`${e.name} équipé sur ${s.name}.`); rf.equipIdx = null; rf.eDone = true; render();
  },
  skipEquip() { UI.rf.skips++; UI.rf.eDone = true; render(); },
  mv(d) {
    const b = UI.g.board, i = b.findIndex(x => x.uid === +d.uid), j = i + +d.dir;
    if (j >= 0 && j < b.length) { [b[i], b[j]] = [b[j], b[i]]; render(); }
  },
  finishRenfort() {
    const msgs = []; closeRenfort(UI.g, UI.rf.skips, m => msgs.push(m));
    UI.notice = msgs.join(' '); startCombatUI();
  },
  restart() { clearTimeout(UI.timer); UI.screen = 'menu'; UI.sel.heroes = []; render(); }
};
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (b && !b.disabled && ACT[b.dataset.act]) ACT[b.dataset.act](b.dataset);
});
render();
</script>
</body>
</html>
